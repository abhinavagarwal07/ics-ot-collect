name: Corpus incremental (six hourly)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      cold_bootstraps:
        description: 'Explicit fresh public working-state bootstraps this cycle (0–8)'
        required: false
        default: 0
        type: number

permissions:
  contents: write

env:
  # Existing bounded metadata-only sink; response bodies and secrets are excluded.
  ICSOT_DEBUG: '1'

# Shared with the selected pilot: at most one cohort/pilot run owns the eight
# cohort slots. Pending runs queue in this shared group without replacing work.
concurrency:
  group: persistent-collection
  cancel-in-progress: false
  queue: max

defaults:
  run:
    working-directory: icsot-observatory
    shell: bash

jobs:
  cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      slot: ${{ steps.freeze.outputs.slot }}
      cold_bootstraps: ${{ steps.freeze.outputs.cold_bootstraps }}
    steps:
      - name: Freeze the cycle slot and validate the shared bootstrap allowance
        working-directory: .
        id: freeze
        env:
          COLD_BOOTSTRAPS: ${{ inputs.cold_bootstraps }}
        run: |
          python - <<'PY'
          import os
          import time

          raw = os.environ.get("COLD_BOOTSTRAPS") or "0"
          if not raw.isascii() or not raw.isdecimal() or not 0 <= int(raw) <= 8:
              raise SystemExit("cold_bootstraps must be an integer from 0 to 8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"slot={int(time.time() // 21600)}", file=output)
              print(f"cold_bootstraps={int(raw)}", file=output)
          PY

  p0:
    needs: cycle
    uses: ./.github/workflows/corpus-priority-tier.yml
    with:
      priority_tier: P0
      schedule_slot: ${{ needs.cycle.outputs.slot }}
      cold_bootstraps: ${{ fromJSON(needs.cycle.outputs.cold_bootstraps) }}
    secrets: inherit

  p1:
    needs: [cycle, p0]
    if: ${{ !cancelled() && needs.cycle.result == 'success' && needs.p0.outputs.stop_lower_tiers != 'true' }}
    uses: ./.github/workflows/corpus-priority-tier.yml
    with:
      priority_tier: P1
      schedule_slot: ${{ needs.cycle.outputs.slot }}
      cold_bootstraps: ${{ fromJSON(needs.p0.outputs.cold_bootstraps_remaining || '0') }}
    secrets: inherit

  p2:
    needs: [cycle, p0, p1]
    if: ${{ !cancelled() && needs.cycle.result == 'success' && needs.p0.outputs.stop_lower_tiers != 'true' && needs.p1.outputs.stop_lower_tiers != 'true' }}
    uses: ./.github/workflows/corpus-priority-tier.yml
    with:
      priority_tier: P2
      schedule_slot: ${{ needs.cycle.outputs.slot }}
      cold_bootstraps: ${{ fromJSON(needs.p1.outputs.cold_bootstraps_remaining || '0') }}
    secrets: inherit
