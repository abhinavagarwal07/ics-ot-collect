name: Corpus baseline (one time)

# Manual only. This is an initial shallow observation, not recurring deployment.
on:
  workflow_dispatch:
    inputs:
      parent_release_tag:
        description: 'Optional prior baseline release; reuse only verified complete captures'
        required: false
        type: string
      additional_parent_release_tags:
        description: 'Optional comma-separated fallback parent releases, in priority order (16 total maximum)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: corpus-baseline
  cancel-in-progress: false

defaults:
  run:
    working-directory: icsot-observatory
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      remaining_count: ${{ steps.plan.outputs.remaining_count }}
      parent_release_tags: ${{ steps.plan.outputs.parent_release_tags }}
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: Check out collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install collector
        run: python -m pip install --disable-pip-version-check -e .
      - name: Require the configured RSA public recipient
        run: |
          python - <<'PY'
          from icsot_observer.encryption import public_key_fingerprint
          print("Encrypted evidence recipient:", public_key_fingerprint("keys/results-rsa-public.pem"))
          PY
      - name: Validate complete cohort and plan independent captures
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RELEASE_TAG: ${{ inputs.parent_release_tag }}
          ADDITIONAL_PARENT_RELEASE_TAGS: ${{ inputs.additional_parent_release_tags }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          parents = [tag.strip() for tag in [os.environ.get("PARENT_RELEASE_TAG", ""),
              *os.environ.get("ADDITIONAL_PARENT_RELEASE_TAGS", "").split(",")] if tag.strip()]
          command = [sys.executable, "scripts/capture_baseline.py", "plan", "--config", "config.corpus.toml",
              "--csv", "../public_patch_corpus_185.csv", "--github-output", os.environ["GITHUB_OUTPUT"],
              "--plan-output", "analysis/baseline-plan/resume-plan.json"]
          if parents:
              command += ["--release-repository", os.environ["GITHUB_REPOSITORY"]]
          for position, tag in enumerate(parents):
              command += ["--parent-release-tag" if position == 0 else "--additional-parent-release-tag", tag]
          raise SystemExit(subprocess.call(command))
          PY
      - name: Create draft transfer release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_SHA256: ${{ steps.plan.outputs.config_source_sha256 }}
          CSV_SHA256: ${{ steps.plan.outputs.csv_sha256 }}
          PARENT_RELEASE_TAG: ${{ inputs.parent_release_tag }}
          PARENT_RELEASE_TAGS_JSON: ${{ steps.plan.outputs.parent_release_tags }}
          INHERITED_COMPLETE_COUNT: ${{ steps.plan.outputs.inherited_complete_count }}
          REMAINING_COUNT: ${{ steps.plan.outputs.remaining_count }}
        run: |
          set -euo pipefail
          release_tag="corpus-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p analysis/baseline-plan
          cat > analysis/baseline-plan/release-notes.md <<EOF
          Initial capture is INCOMPLETE and remains a draft while jobs run.

          Declared cohort: all 185 repositories in the source CSV, in configuration order.
          Collector commit: $GITHUB_SHA
          Configuration SHA-256: $CONFIG_SHA256
          CSV SHA-256: $CSV_SHA256
          Parent release: ${PARENT_RELEASE_TAG:-none}
          Ordered verified parent release set: $PARENT_RELEASE_TAGS_JSON
          Verified complete parent captures referenced: $INHERITED_COMPLETE_COUNT
          Targets selected for this run: $REMAINING_COUNT

          Accepted parent captures remain in the parent release and are referenced by the final inventory with their original collector commit and index hash. Incomplete parent outcomes are retried.

          Each target attempts shallow full REST listings and advertised Git refs with a portable full bundle. Main payloads are encrypted using AES-256-GCM with RSA-OAEP-SHA256 key wrapping before upload. Only metadata and the public recipient key remain public. Historical per-item backfill and Discussions are excluded. Pending OpenTimestamps receipts are not verified Bitcoin timestamps.

          Per-repository indexes are uploaded after encrypted archive-part attempts, including partial/error outcomes. The final inventory identifies missing and incomplete targets before this draft is published once. No recurring schedule, automatic deletion or expiry is configured. Release assets remain deletable; the RSA private key stays on the owner's machine.
          EOF
          gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Corpus baseline ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}" --notes-file analysis/baseline-plan/release-notes.md
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"

  capture:
    needs: plan
    if: ${{ needs.plan.outputs.remaining_count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Capture ${{ matrix.slug }}
    steps:
      - name: Check out collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install collector and pinned timestamp client
        run: python -m pip install --disable-pip-version-check -e . opentimestamps-client==0.7.2
      - name: Capture, verify, split archive, and transfer even partial outcomes
        env:
          # API reads use the optional public read credential. Release writes
          # remain on this workflow's separate, repository-scoped GH_TOKEN.
          GITHUB_TOKEN: ${{ secrets.COLLECTOR_READ_TOKEN || github.token }}
          GH_TOKEN: ${{ github.token }}
          CAPTURE_SLUG: ${{ matrix.slug }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
        run: |
          python scripts/capture_baseline.py capture \
            --config config.corpus.toml \
            --csv ../public_patch_corpus_185.csv \
            --slug "$CAPTURE_SLUG" \
            --release-tag "$RELEASE_TAG" \
            --release-repository "$GITHUB_REPOSITORY" \
            --code-sha "$GITHUB_SHA" \
            --work-root analysis/corpus-baseline

  finalize:
    needs: [plan, capture]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Check out collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install collector
        run: python -m pip install --disable-pip-version-check -e .
      - name: Inventory terminal outcomes and publish once, including explicit gaps
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          BASELINE_MATRIX_RESULT: ${{ needs.capture.result }}
          PARENT_RELEASE_TAGS_JSON: ${{ needs.plan.outputs.parent_release_tags }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          command = [sys.executable, "scripts/capture_baseline.py", "finalize", "--config", "config.corpus.toml",
              "--csv", "../public_patch_corpus_185.csv", "--release-tag", os.environ["RELEASE_TAG"],
              "--release-repository", os.environ["GITHUB_REPOSITORY"], "--code-sha", os.environ["GITHUB_SHA"],
              "--work-root", "analysis/corpus-baseline-finalize"]
          for position, tag in enumerate(json.loads(os.environ["PARENT_RELEASE_TAGS_JSON"])):
              command += ["--parent-release-tag" if position == 0 else "--additional-parent-release-tag", tag]
          raise SystemExit(subprocess.call(command))
          PY
